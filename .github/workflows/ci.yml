name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-ninja
            qt_version: "6.10.3"
            qt_arch: win64_msvc2022_64
            aqt_host: windows
          - os: macos-latest
            preset: macos
            qt_version: "6.10.3"
            qt_arch: clang_64
            aqt_host: mac
          - os: ubuntu-22.04
            preset: linux
            qt_version: "6.10.3"
            qt_arch: linux_gcc_64
            aqt_host: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Qt's online repo was restructured (nested metadata dirs, renamed
      # hosts/arches) which aqtinstall 3.3.0 predates, so CI uses the
      # first-party installer in packaging/ci instead. Cached per
      # version/arch/OS after the first green run.
      - name: Restore cached Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/Qt
          key: qt-${{ matrix.qt_version }}-${{ matrix.qt_arch }}-${{ runner.os }}-v2

      - name: Install Qt
        shell: bash
        run: |
          python3 -m pip install py7zr
          python3 packaging/ci/install-qt.py --host ${{ matrix.aqt_host }} \
            --version ${{ matrix.qt_version }} --arch ${{ matrix.qt_arch }} \
            --outputdir "${{ github.workspace }}/Qt"

      - name: Install Linux system deps
        if: startsWith(matrix.os, 'ubuntu')
        run: >
          sudo apt-get update &&
          sudo apt-get install -y build-essential libgl1-mesa-dev
          libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4
          libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
          libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0
          libxcb-xkb-dev

      - name: Set up MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        if: matrix.preset != 'windows-msvc'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
