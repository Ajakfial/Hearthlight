name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-ninja
            qt_version: "6.10.3"
            qt_arch: win64_msvc2019_64
          - os: macos-latest
            preset: macos
            qt_version: "6.10.3"
            qt_arch: clang_64
          - os: ubuntu-22.04
            preset: linux
            qt_version: "6.10.3"
            qt_arch: gcc_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Set up MSVC (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja (non-MSVC presets)
        if: matrix.preset != 'windows-msvc'
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
